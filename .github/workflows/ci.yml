name: ci

# Chequeos rápidos que antes no corrían en ningún lado (el único workflow era
# el e2e de aislamiento): lint + tests unitarios + build del API, y lint +
# build del CRM y de la web pública.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predia-saas
    # Solo para que el AppModule valide su config al arrancar en el smoke test;
    # PrismaService conecta de forma lazy, no hace falta una base real.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SYSTEM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-value-min-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-min-32-chars
      EMAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: predia-saas/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: predia-saas/predia-api
        run: pnpm run lint:check
      - name: Unit tests
        working-directory: predia-saas/predia-api
        run: pnpm run test
      - name: Build
        working-directory: predia-saas/predia-api
        run: pnpm run build
      # El build compilaba pero no arrancaba (dist/src/main.js en vez de
      # dist/main.js, y require('express') sin resolver): levantarlo de verdad.
      - name: Smoke — el build compilado arranca
        working-directory: predia-saas/predia-api
        run: |
          node dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/docs-json > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predia-saas
    # generate:openapi levanta el AppModule para leer los decoradores: valida
    # las env vars pero no se conecta a la base (la conexión es lazy).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SYSTEM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-value-min-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-min-32-chars
      EMAIL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: predia-saas/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generar tipos del API (@predia/api-types)
        run: pnpm generate:api
      - name: Lint CRM
        working-directory: predia-saas/predia-front
        run: pnpm run lint
      - name: Build CRM
        working-directory: predia-saas/predia-front
        run: pnpm run build
      - name: Build web pública
        working-directory: predia-saas/predia-website
        run: pnpm run build
